user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 100;
  types_hash_max_size 2048;
  server_tokens off;

  client_max_body_size 20M;
  client_body_timeout 12;
  client_header_timeout 12;
  send_timeout 10;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript
             application/json application/javascript application/xml+rss
             application/rss+xml application/atom+xml image/svg+xml;
  gzip_disable "msie6";

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
  limit_req_status 429;

  server {
    listen 80 default_server;
    server_name _;

    error_page 404 /404.json;
    error_page 500 502 503 504 /50x.json;

    location = /404.json {
      internal;
      default_type application/json;
      return 404 '{"success":false,"error":"Not found","statusCode":404}';
    }

    location = /50x.json {
      internal;
      default_type application/json;
      return 500 '{"success":false,"error":"Gateway error","statusCode":500}';
    }

    location = /health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"healthy","service":"api-gateway","timestamp":"$time_iso8601"}';
      add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/auth {
      limit_req zone=auth_limit burst=20 nodelay;
      set $upstream http://auth-service:3001;
      rewrite ^/api/auth(/?.*)$ /auth$1 break;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 5s;
      proxy_send_timeout 10s;
      proxy_read_timeout 10s;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_redirect off;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location /api/products {
      limit_req zone=api_limit burst=30 nodelay;
      set $upstream http://product-service:3002;
      rewrite ^/api/products$ /products break;
      rewrite ^/api/products(/.*)$ $1 break;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 5s;
      proxy_send_timeout 15s;
      proxy_read_timeout 15s;
      proxy_buffering off;
      proxy_redirect off;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location /api/pricing {
      limit_req zone=api_limit burst=30 nodelay;
      set $upstream http://pricing-service:3003;
      rewrite ^/api/pricing(/?.*)$ /pricing$1 break;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 5s;
      proxy_send_timeout 10s;
      proxy_read_timeout 10s;
      proxy_buffering off;
      proxy_redirect off;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location /api/buyers {
      limit_req zone=api_limit burst=20 nodelay;
      set $upstream http://buyer-service:3004;
      rewrite ^/api/buyers(/?.*)$ /buyers$1 break;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 5s;
      proxy_send_timeout 10s;
      proxy_read_timeout 10s;
      proxy_buffering off;
      proxy_redirect off;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location /api/checkout {
      limit_req zone=api_limit burst=20 nodelay;
      set $upstream http://cart-checkout-service:3005;
      rewrite ^/api/checkout(/?.*)$ /checkout$1 break;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 5s;
      proxy_send_timeout 15s;
      proxy_read_timeout 15s;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_redirect off;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location /api/cart {
      limit_req zone=api_limit burst=20 nodelay;
      set $upstream http://cart-checkout-service:3005;
      rewrite ^/api/cart(/?.*)$ /cart$1 break;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 5s;
      proxy_send_timeout 10s;
      proxy_read_timeout 10s;
      proxy_buffering off;
      proxy_redirect off;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location /api/orders {
      limit_req zone=api_limit burst=20 nodelay;
      set $upstream http://order-service:3006;
      rewrite ^/api/orders(/?.*)$ /orders$1 break;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 5s;
      proxy_send_timeout 10s;
      proxy_read_timeout 10s;
      proxy_buffering off;
      proxy_redirect off;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location /api/payments {
      limit_req zone=api_limit burst=20 nodelay;
      set $upstream http://payment-service:3007;
      rewrite ^/api/payments(/?.*)$ /payments$1 break;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 5s;
      proxy_send_timeout 15s;
      proxy_read_timeout 15s;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_redirect off;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location /api/inventory {
      limit_req zone=api_limit burst=20 nodelay;
      set $upstream http://inventory-service:3008;
      rewrite ^/api/inventory(/?.*)$ /inventory$1 break;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 5s;
      proxy_send_timeout 10s;
      proxy_read_timeout 10s;
      proxy_buffering off;
      proxy_redirect off;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location /api/notifications {
      limit_req zone=api_limit burst=20 nodelay;
      set $upstream http://notification-service:3009;
      rewrite ^/api/notifications(/?.*)$ /notifications$1 break;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 5s;
      proxy_send_timeout 10s;
      proxy_read_timeout 10s;
      proxy_buffering off;
      proxy_redirect off;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location / {
      default_type application/json;
      return 404 '{"success":false,"error":"Not found","message":"API endpoint not found. Use /api/* routes.","statusCode":404}';
    }

    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }
  }
}
